<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('SmartProcure - Enterprise Login')}"></head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-lg border-0 rounded-4" style="width: 100%; max-width: 420px;">
        <div class="card-body p-4 p-sm-5">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 54px; height: 54px;">
                    <i class="bi bi-shield-lock fs-3"></i>
                </div>
                <h4 class="fw-bold mb-1">SmartProcure</h4>
                <p class="text-muted small">Enterprise Vendor & Procurement System</p>
            </div>

            <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
                <div class="mb-3">
                    <label class="form-label text-secondary small fw-semibold">Email Address</label>
                    <input type="email" id="email" class="form-control form-control-lg fs-6" value="admin@smartprocure.local" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary small fw-semibold">Password</label>
                    <input type="password" id="password" class="form-control form-control-lg fs-6" value="ChangeMe@123" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 fs-6 fw-semibold">Sign In</button>
            </form>

            <div class="mt-4 pt-3 border-top text-center">
                <p class="text-muted small mb-0">Development Seed Credentials Loaded</p>
            </div>
        </div>
    </div>

    <script th:src="@{/static/js/app.js}"></script>
    <script>
        function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            SmartProcure.login(email, password);
        }
    </script>
</body>
</html>
