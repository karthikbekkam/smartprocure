<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Dashboard - SmartProcure')}"></head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Executive Dashboard</h3>
                <p class="text-muted small mb-0">Procurement Operations & Vendor Metrics</p>
            </div>
            <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2">
                <i class="bi bi-circle-fill me-1 small"></i> System Active
            </span>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="metric-card">
                    <div class="metric-title">Total Vendors</div>
                    <div class="metric-value" id="totalVendors">--</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card">
                    <div class="metric-title">Pending Approvals</div>
                    <div class="metric-value" id="pendingApprovals">--</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card">
                    <div class="metric-title">Low Stock Alerts</div>
                    <div class="metric-value" id="lowStockAlerts">--</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card">
                    <div class="metric-title">Monthly Spend</div>
                    <div class="metric-value" id="monthlySpend">$0.00</div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/static/js/app.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const res = await SmartProcure.fetch('/dashboard/metrics');
            if (res && res.success) {
                document.getElementById('totalVendors').innerText = res.data.totalVendors;
                document.getElementById('pendingApprovals').innerText = res.data.pendingVendorApprovals;
                document.getElementById('lowStockAlerts').innerText = res.data.lowStockAlerts;
                document.getElementById('monthlySpend').innerText = '$' + Number(res.data.monthlyProcurementValue).toLocaleString();
            }
        });
    </script>
</body>
</html>
