<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Purchase Requests - SmartProcure')}"></head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Internal Purchase Requisitions</h3>
                <p class="text-muted small mb-0">Departmental material requests and managerial approval workflow</p>
            </div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newPrModal">
                <i class="bi bi-plus-lg me-1"></i> Create Requisition
            </button>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>PR Number</th>
                                <th>Department</th>
                                <th>Requester</th>
                                <th>Total Estimated Amount</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="prTableBody">
                            <tr>
                                <td colspan="6" class="text-center py-4 text-muted">Loading purchase requests...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Create PR Modal -->
    <div class="modal fade" id="newPrModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Create Purchase Requisition</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="prForm">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Department</label>
                            <input type="text" id="prDepartment" class="form-control" placeholder="e.g. IT Operations" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Product ID</label>
                            <input type="number" id="prProductId" class="form-control" value="1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Quantity</label>
                            <input type="number" id="prQuantity" class="form-control" value="5" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Estimated Unit Price ($)</label>
                            <input type="number" step="0.01" id="prUnitPrice" class="form-control" value="1499.99" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="submitPrForm()">Submit Requisition</button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/static/js/app.js}"></script>
    <script th:src="@{/static/js/pr.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
