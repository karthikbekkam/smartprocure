<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SmartProcure Enterprise</title>
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            max-width: 550px;
            width: 100%;
            padding: 40px;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.15);
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="text-center mb-4">
        <a th:href="@{/}" class="text-dark text-decoration-none fw-bold fs-4 d-inline-flex align-items-center gap-2">
            <i class="fa-solid fa-boxes-packing text-primary"></i> SmartProcure
        </a>
        <h4 class="fw-extrabold mt-3 mb-1">Reset Your Password</h4>
        <p class="text-muted small">Enter your registered work email address and we will help you securely regain access.</p>
    </div>

    <div id="forgotAlert" class="alert alert-danger d-none" role="alert"></div>
    <div id="forgotSuccess" class="alert alert-success d-none" role="alert"></div>

    <form id="forgotForm">
        <div class="mb-4">
            <label class="form-label small fw-semibold">Work Email Address</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-envelope text-muted"></i></span>
                <input type="email" id="email" class="form-control border-start-0" placeholder="Enter your work email address" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold mb-3 shadow-sm" id="btnSubmit">
            Send Reset Instructions <i class="fa-solid fa-paper-plane ms-1"></i>
        </button>
    </form>

    <div class="text-center mt-3 pt-3 border-top">
        <span class="text-muted small">Remember your password? </span>
        <a th:href="@{/login}" class="fw-bold text-primary text-decoration-none small">Sign In Here</a>
    </div>
</div>

<script>
    document.getElementById('forgotForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const alertBox = document.getElementById('forgotAlert');
        const successBox = document.getElementById('forgotSuccess');
        const btn = document.getElementById('btnSubmit');

        alertBox.classList.add('d-none');
        successBox.classList.add('d-none');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin me-2"></i> Submitting...';

        const email = document.getElementById('email').value;

        try {
            const res = await fetch('/smartprocure/api/v1/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });

            successBox.textContent = 'If an account exists for this email, password reset instructions have been sent.';
            successBox.classList.remove('d-none');
        } catch (err) {
            successBox.textContent = 'If an account exists for this email, password reset instructions have been sent.';
            successBox.classList.remove('d-none');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Send Reset Instructions <i class="fa-solid fa-paper-plane ms-1"></i>';
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
