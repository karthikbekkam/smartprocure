<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Vendor Directory - SmartProcure')}"></head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Enterprise Vendor Directory</h3>
                <p class="text-muted small mb-0">Supplier onboarding, compliance review, and status lifecycle</p>
            </div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newVendorModal">
                <i class="bi bi-plus-lg me-1"></i> Onboard New Vendor
            </button>
        </div>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body p-3">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" id="searchInput" class="form-control" placeholder="Search by company name or tax ID...">
                    </div>
                    <div class="col-md-3">
                        <select id="statusFilter" class="form-select" onchange="loadVendors()">
                            <option value="">All Statuses</option>
                            <option value="REGISTERED">REGISTERED</option>
                            <option value="UNDER_REVIEW">UNDER_REVIEW</option>
                            <option value="APPROVED">APPROVED</option>
                            <option value="REJECTED">REJECTED</option>
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="INACTIVE">INACTIVE</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Vendor ID</th>
                                <th>Company Name</th>
                                <th>Tax ID</th>
                                <th>Contact Email</th>
                                <th>Phone</th>
                                <th>Payment Terms</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="vendorTableBody">
                            <tr>
                                <td colspan="8" class="text-center py-4 text-muted">Loading vendor records...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Onboard Vendor Modal -->
    <div class="modal fade" id="newVendorModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Onboard New Supplier</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="vendorForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Company Name</label>
                                <input type="text" id="companyName" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Tax ID / EIN</label>
                                <input type="text" id="taxId" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Contact Email</label>
                                <input type="email" id="contactEmail" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Contact Phone</label>
                                <input type="text" id="contactPhone" class="form-control" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-semibold">Registered Business Address</label>
                                <textarea id="address" class="form-control" rows="2" required></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Payment Terms</label>
                                <select id="paymentTerms" class="form-select">
                                    <option value="NET_15">NET 15 Days</option>
                                    <option value="NET_30" selected>NET 30 Days</option>
                                    <option value="NET_60">NET 60 Days</option>
                                    <option value="DUE_ON_RECEIPT">Due on Receipt</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Business License #</label>
                                <input type="text" id="businessLicenseNumber" class="form-control">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="submitVendorForm()">Save Vendor Profile</button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/static/js/app.js}"></script>
    <script th:src="@{/static/js/vendor.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
