server:
  port: 8080
  servlet:
    context-path: /api/v1
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: smartprocure-backend
  threads:
    virtual:
      enabled: true
  profiles:
    active: dev

  # Database DataSource Configuration (HikariCP)
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartprocure_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: SmartProcureHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 15000

  # JPA & Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
    open-in-view: false

  # Mail Configuration (SMTP Server)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply.smartprocure@gmail.com}
    password: ${MAIL_PASSWORD:secret_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Security & JWT Configuration Matrix
smartprocure:
  app:
    jwtSecret: 404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
    jwtExpirationMs: 86400000 # 24 Hours in Milliseconds
    jwtRefreshExpirationMs: 604800000 # 7 Days in Milliseconds

# Spring Boot Actuator Telemetry
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
