<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Inventory & Warehouses - SmartProcure')}"></head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Multi-Warehouse Inventory Control</h3>
                <p class="text-muted small mb-0">Stock levels, physical allocation, and reorder alerts</p>
            </div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#stockAdjustModal">
                <i class="bi bi-arrow-left-right me-1"></i> Stock Adjustment
            </button>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Product SKU</th>
                                <th>Product Name</th>
                                <th>Warehouse Location</th>
                                <th>On Hand</th>
                                <th>Allocated</th>
                                <th>Available</th>
                                <th>Min Threshold</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTableBody">
                            <tr>
                                <td colspan="8" class="text-center py-4 text-muted">Loading inventory items...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Stock Adjustment Modal -->
    <div class="modal fade" id="stockAdjustModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Adjust Warehouse Stock Level</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="stockForm">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Product ID</label>
                            <input type="number" id="adjProductId" class="form-control" value="1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Warehouse ID</label>
                            <input type="number" id="adjWarehouseId" class="form-control" value="1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Quantity Adjustment (+/-)</label>
                            <input type="number" id="adjQuantity" class="form-control" placeholder="e.g. 50 or -10" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="submitStockAdjust()">Update Stock</button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/static/js/app.js}"></script>
    <script th:src="@{/static/js/inventory.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
