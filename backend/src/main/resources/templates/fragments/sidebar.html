<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar" class="sidebar">
    <a href="/smartprocure/dashboard" class="sidebar-brand">
        <i class="bi bi-shield-check text-primary"></i>
        <span>SmartProcure</span>
    </a>
    <ul class="sidebar-nav">
        <li class="nav-item">
            <a href="/smartprocure/dashboard" class="nav-link">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
            </a>
        </li>
        <li class="nav-item">
            <a href="/smartprocure/vendors" class="nav-link">
                <i class="bi bi-building"></i>
                <span>Vendors</span>
            </a>
        </li>
        <li class="nav-item">
            <a href="/smartprocure/products" class="nav-link">
                <i class="bi bi-box-seam"></i>
                <span>Products Catalog</span>
            </a>
        </li>
        <li class="nav-item">
            <a href="/smartprocure/purchase-requests" class="nav-link">
                <i class="bi bi-file-earmark-text"></i>
                <span>Purchase Requests</span>
            </a>
        </li>
        <li class="nav-item">
            <a href="/smartprocure/purchase-orders" class="nav-link">
                <i class="bi bi-cart-check"></i>
                <span>Purchase Orders</span>
            </a>
        </li>
        <li class="nav-item">
            <a href="/smartprocure/invoices" class="nav-link">
                <i class="bi bi-receipt"></i>
                <span>Invoices</span>
            </a>
        </li>
        <li class="nav-item">
            <a href="/smartprocure/inventory" class="nav-link">
                <i class="bi bi-boxes"></i>
                <span>Inventory & Warehouses</span>
            </a>
        </li>
    </ul>
    <div style="position: absolute; bottom: 1.5rem; width: calc(100% - 2rem);">
        <button onclick="SmartProcure.logout()" class="btn btn-outline-light w-100 btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i> Sign Out
        </button>
    </div>
</div>
</body>
</html>
