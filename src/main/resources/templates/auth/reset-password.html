<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - SmartProcure Enterprise</title>
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            max-width: 550px;
            width: 100%;
            padding: 40px;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="text-center mb-4">
        <a th:href="@{/}" class="text-dark text-decoration-none fw-bold fs-4 d-inline-flex align-items-center gap-2">
            <i class="fa-solid fa-boxes-packing text-primary"></i> SmartProcure
        </a>
        <h4 class="fw-extrabold mt-3 mb-1">Set New Password</h4>
        <p class="text-muted small">Create a new secure password for your enterprise account.</p>
    </div>

    <div id="resetAlert" class="alert alert-danger d-none" role="alert"></div>
    <div id="resetSuccess" class="alert alert-success d-none" role="alert"></div>

    <form id="resetForm">
        <div class="mb-3">
            <label class="form-label small fw-semibold">Reset Token</label>
            <input type="text" id="token" class="form-control" placeholder="Enter or paste your reset token" required>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold">New Password</label>
            <input type="password" id="newPassword" class="form-control" placeholder="Enter a strong new password" required>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-semibold">Confirm New Password</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your new password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold mb-3 shadow-sm" id="btnSubmit">
            Set New Password <i class="fa-solid fa-key ms-1"></i>
        </button>
    </form>

    <div class="text-center mt-3 pt-3 border-top">
        <a th:href="@{/login}" class="fw-bold text-primary text-decoration-none small"><i class="fa-solid fa-arrow-left me-1"></i> Return to Sign In</a>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const tokenFromUrl = urlParams.get('token');
    if (tokenFromUrl) {
        document.getElementById('token').value = tokenFromUrl;
    }

    document.getElementById('resetForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const alertBox = document.getElementById('resetAlert');
        const successBox = document.getElementById('resetSuccess');
        const btn = document.getElementById('btnSubmit');

        alertBox.classList.add('d-none');
        successBox.classList.add('d-none');

        const newPwd = document.getElementById('newPassword').value;
        const confirmPwd = document.getElementById('confirmPassword').value;

        if (newPwd !== confirmPwd) {
            alertBox.textContent = 'Passwords do not match.';
            alertBox.classList.remove('d-none');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin me-2"></i> Updating...';

        const payload = {
            token: document.getElementById('token').value,
            newPassword: newPwd
        };

        try {
            const res = await fetch('/smartprocure/api/v1/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (res.ok && data.success) {
                successBox.textContent = 'Password reset successfully! Redirecting to login...';
                successBox.classList.remove('d-none');
                setTimeout(() => window.location.href = '/smartprocure/login', 1500);
            } else {
                alertBox.textContent = data.message || 'Password reset failed. Invalid or expired token.';
                alertBox.classList.remove('d-none');
            }
        } catch (err) {
            alertBox.textContent = 'Invalid or expired token.';
            alertBox.classList.remove('d-none');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Set New Password <i class="fa-solid fa-key ms-1"></i>';
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
