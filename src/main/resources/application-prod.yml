spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smartprocure?useSSL=true&serverTimezone=UTC}
    username: ${DB_USERNAME:smartprocure_user}
    password: ${DB_PASSWORD:SecretPass123!}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:notifications@smartprocure.com}
    password: ${MAIL_PASSWORD:changeit}

app:
  jwt:
    secret: ${JWT_SECRET:9a8f7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
