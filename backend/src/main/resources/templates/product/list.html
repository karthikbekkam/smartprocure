<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Product Catalog - SmartProcure')}"></head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Product Catalog & Master Sourcing</h3>
                <p class="text-muted small mb-0">Master catalog of items, pricing, reorder thresholds, and categories</p>
            </div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newProductModal">
                <i class="bi bi-plus-lg me-1"></i> Add Product
            </button>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>SKU</th>
                                <th>Product Name</th>
                                <th>Category</th>
                                <th>Unit Price</th>
                                <th>Reorder Level</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody">
                            <tr>
                                <td colspan="6" class="text-center py-4 text-muted">Loading products...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Product Modal -->
    <div class="modal fade" id="newProductModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Add Product to Catalog</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="productForm">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">SKU</label>
                            <input type="text" id="prodSku" class="form-control" placeholder="e.g. SKU-LAP-001" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Product Name</label>
                            <input type="text" id="prodName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Category ID</label>
                            <input type="number" id="prodCategoryId" class="form-control" value="1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Unit Price ($)</label>
                            <input type="number" step="0.01" id="prodUnitPrice" class="form-control" placeholder="99.99" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Reorder Threshold Level</label>
                            <input type="number" id="prodReorderLevel" class="form-control" value="10" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Description</label>
                            <textarea id="prodDescription" class="form-control" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="submitProductForm()">Save Product</button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/static/js/app.js}"></script>
    <script th:src="@{/static/js/product.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
