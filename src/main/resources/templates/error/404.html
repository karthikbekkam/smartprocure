<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - SmartProcure Enterprise</title>
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }
        .error-card {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body>
<div class="error-card">
    <h1 class="display-3 font-monospace text-primary fw-extrabold mb-0">404</h1>
    <h3 class="fw-extrabold mb-2">Resource Not Found</h3>
    <p class="text-white-50 small mb-4">The page or endpoint you are looking for does not exist or has been moved.</p>
    <div class="d-flex justify-content-center gap-2">
        <a th:href="@{/}" class="btn btn-primary px-4 fw-bold"><i class="fa-solid fa-house me-1"></i> Return to Home</a>
        <a th:href="@{/dashboard}" class="btn btn-outline-light px-3"><i class="fa-solid fa-gauge-high me-1"></i> Dashboard</a>
    </div>
</div>
</body>
</html>
