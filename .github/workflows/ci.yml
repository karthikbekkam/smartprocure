name: SmartProcure CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and Run Unit/Integration Tests
      run: |
        cd backend
        mvn clean test

    - name: Package Application JAR
      run: |
        cd backend
        mvn package -DskipTests
