<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="navbar" class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
    <div class="search-box d-flex align-items-center gap-3">
        <div class="input-group" style="width: 320px;">
            <span class="input-group-text bg-transparent border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
            <input type="text" class="form-control border-start-0 ps-0" placeholder="Search POs, Vendors, Products...">
        </div>
    </div>

    <div class="d-flex align-items-center gap-3">
        <button id="themeToggleBtn" class="btn btn-icon btn-light rounded-circle border shadow-sm" title="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
        </button>

        <div class="dropdown">
            <button class="btn btn-light rounded-circle border position-relative" data-bs-toggle="dropdown">
                <i class="fa-solid fa-bell"></i>
                <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-lg" style="width: 300px;">
                <li class="dropdown-header fw-bold">Enterprise Notifications</li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item small" href="#"><i class="fa-solid fa-circle-exclamation text-warning me-2"></i>PR-2026-001 pending approval</a></li>
                <li><a class="dropdown-item small" href="#"><i class="fa-solid fa-check text-success me-2"></i>Vendor Acme Inc. approved</a></li>
            </ul>
        </div>

        <div class="dropdown">
            <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark" data-bs-toggle="dropdown">
                <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold me-2" style="width: 38px; height: 38px;">
                    S
                </div>
                <div>
                    <div class="fw-semibold small">SmartProcure User</div>
                    <div class="text-muted extra-small">Enterprise Session</div>
                </div>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow-lg">
                <li><a class="dropdown-item" th:href="@{/profile}"><i class="fa-solid fa-user-gear me-2"></i>My Profile</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" th:href="@{/login}"><i class="fa-solid fa-right-from-bracket me-2"></i>Logout</a></li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
